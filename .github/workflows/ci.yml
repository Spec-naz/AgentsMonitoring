name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes agentsmon tests
      - name: Install
        run: python -m pip install .

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify dashboard with fixture data
        run: |
          python tests/verify_mission_browser.py --out browser-evidence/mission
          python tests/verify_plugins_browser.py --out browser-evidence/plugins
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-evidence
          path: browser-evidence/
